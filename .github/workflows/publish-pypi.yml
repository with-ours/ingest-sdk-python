name: Publish PyPI

on:
  workflow_dispatch:
  pull_request:
    types: [closed]

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      startsWith(github.event.pull_request.title, 'release: '))
    name: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Validate merged release PR
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          RELEASE_VERSION="${PR_TITLE#release: }"
          RELEASE_VERSION="${RELEASE_VERSION#v}"
          if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected merged PR title 'release: <semantic version>'; received: $PR_TITLE" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"

      - name: Install Rye
        run: |
          curl -sSf https://rye.astral.sh/get | bash
          echo "$HOME/.rye/shims" >> $GITHUB_PATH
        env:
          RYE_VERSION: '0.44.0'
          RYE_INSTALL_OPTION: '--yes'

      - name: Publish to PyPI
        run: |
          bash ./bin/publish-pypi
        env:
          PYPI_TOKEN: ${{ secrets.OURS_PRIVACY_PYPI_TOKEN || secrets.PYPI_TOKEN }}

      - name: Tag and create GitHub Release
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${RELEASE_VERSION}"
          git fetch --tags --force
          if ! git rev-parse --verify --quiet "refs/tags/$TAG"; then
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$(git rev-parse HEAD)" --generate-notes --title "$TAG"
          fi
