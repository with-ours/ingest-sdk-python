name: Publish PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version to publish
        required: true
        type: string
      commit:
        description: Full release commit SHA already merged into main
        required: true
        type: string
  pull_request:
    types: [closed]

permissions: {}

jobs:
  # Starts this workflow on the default branch when a release PR merges.
  dispatch:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      startsWith(github.event.pull_request.title, 'release: ')
    name: dispatch release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Run this workflow on the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          RELEASE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          RELEASE_VERSION="${PR_TITLE#release: }"
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/publish-pypi.yml/dispatches" \
            -f "ref=$DEFAULT_BRANCH" \
            -f "inputs[version]=$RELEASE_VERSION" \
            -f "inputs[commit]=$RELEASE_COMMIT"
          echo "Dispatched publish-pypi.yml on $DEFAULT_BRANCH for $RELEASE_VERSION at $RELEASE_COMMIT"

  # Validates the release and builds the distributions.
  build:
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.validate.outputs.version }}
      commit: ${{ steps.validate.outputs.commit }}
      sdist: ${{ steps.build.outputs.sdist }}
      sdist_sha256: ${{ steps.build.outputs.sdist_sha256 }}
      wheel: ${{ steps.build.outputs.wheel }}
      wheel_sha256: ${{ steps.build.outputs.wheel_sha256 }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate release version and commit
        id: validate
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ inputs.commit }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          RELEASE_VERSION="${INPUT_VERSION#v}"
          if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a semantic release version" >&2
            exit 1
          fi
          if ! [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Expected a full release commit SHA" >&2
            exit 1
          fi
          git merge-base --is-ancestor "$RELEASE_COMMIT" "origin/$DEFAULT_BRANCH"
          git checkout --quiet --detach "$RELEASE_COMMIT"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          test "$(jq -er '.["."]' .release-please-manifest.json)" = "$RELEASE_VERSION"
          TAG="v${RELEASE_VERSION}"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            test "$(git rev-parse "$TAG^{commit}")" = "$RELEASE_COMMIT"
          fi
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6'
          enable-cache: false

      - name: Build distributions
        id: build
        run: |
          set -euo pipefail
          uv build
          shopt -s nullglob
          files=(dist/*)
          sdists=(dist/*.tar.gz)
          wheels=(dist/*.whl)
          if [[ "${#files[@]}" -ne 2 || "${#sdists[@]}" -ne 1 || "${#wheels[@]}" -ne 1 ]]; then
            echo "Expected exactly one source distribution and one wheel in dist/" >&2
            exit 1
          fi
          sdist_sha256="$(sha256sum "${sdists[0]}" | cut -d' ' -f1)"
          wheel_sha256="$(sha256sum "${wheels[0]}" | cut -d' ' -f1)"
          {
            echo "sdist=${sdists[0]#dist/}"
            echo "sdist_sha256=$sdist_sha256"
            echo "wheel=${wheels[0]#dist/}"
            echo "wheel_sha256=$wheel_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/${{ steps.build.outputs.sdist }}
            dist/${{ steps.build.outputs.wheel }}
          if-no-files-found: error
          retention-days: 7

  # Uploads the built distributions to PyPI, then tags and creates the GitHub Release.
  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
      RELEASE_COMMIT: ${{ needs.build.outputs.commit }}

    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6'
          enable-cache: false
          ignore-empty-workdir: true

      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: ${{ runner.temp }}/dist

      - name: Verify distribution checksums
        env:
          SDIST_FILE: ${{ runner.temp }}/dist/${{ needs.build.outputs.sdist }}
          SDIST_SHA256: ${{ needs.build.outputs.sdist_sha256 }}
          WHEEL_FILE: ${{ runner.temp }}/dist/${{ needs.build.outputs.wheel }}
          WHEEL_SHA256: ${{ needs.build.outputs.wheel_sha256 }}
        run: |
          set -euo pipefail
          printf '%s  %s\n' "$SDIST_SHA256" "$SDIST_FILE" "$WHEEL_SHA256" "$WHEEL_FILE" | sha256sum --check --strict

      - name: Publish to PyPI
        env:
          SDIST_FILE: ${{ runner.temp }}/dist/${{ needs.build.outputs.sdist }}
          WHEEL_FILE: ${{ runner.temp }}/dist/${{ needs.build.outputs.wheel }}
        run: |
          set -euo pipefail
          uv publish --trusted-publishing always "$SDIST_FILE" "$WHEEL_FILE"

      # Needed for tagging.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.build.outputs.commit }}

      - name: Tag and create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          TAG="v${RELEASE_VERSION}"
          git fetch --tags origin
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            test "$(git rev-parse "$TAG^{commit}")" = "$RELEASE_COMMIT"
          else
            git tag -a "$TAG" "$RELEASE_COMMIT" -m "Release $TAG"
            git -c credential.helper='!gh auth git-credential' push origin "refs/tags/$TAG"
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --target "$RELEASE_COMMIT" --generate-notes --title "$TAG"
          fi
