name: CI
on: [push, pull_request]

permissions: {}

jobs:
  lint:
    permissions:
      contents: read
    timeout-minutes: 10
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rye
        run: |
          curl -sSf https://rye.astral.sh/get | bash
          echo "$HOME/.rye/shims" >> $GITHUB_PATH
        env:
          RYE_VERSION: '0.44.0'
          RYE_INSTALL_OPTION: '--yes'

      - name: Install dependencies
        run: rye sync --all-features --no-lock

      - name: Run lints
        run: ./scripts/lint

  build:
    permissions:
      contents: read
    timeout-minutes: 10
    name: build (Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9.18', '3.10']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rye
        run: |
          curl -sSf https://rye.astral.sh/get | bash
          echo "$HOME/.rye/shims" >> $GITHUB_PATH
        env:
          RYE_VERSION: '0.44.0'
          RYE_INSTALL_OPTION: '--yes'

      - name: Select build Python
        env:
          BUILD_PYTHON: ${{ matrix.python-version }}
        run: rye pin "$BUILD_PYTHON"

      - name: Install dependencies
        run: rye sync --all-features --no-lock

      - name: Run build
        run: rye build

      - name: Test HTTPX2 base installation
        run: |
          rye run python -m venv "$RUNNER_TEMP/httpx2"
          "$RUNNER_TEMP/httpx2/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/httpx2/bin/python" -c 'import importlib.util; assert importlib.util.find_spec("httpx") is None'
          "$RUNNER_TEMP/httpx2/bin/python" tests/test_http_backend.py

  test:
    permissions:
      contents: read
    timeout-minutes: 10
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rye
        run: |
          curl -sSf https://rye.astral.sh/get | bash
          echo "$HOME/.rye/shims" >> $GITHUB_PATH
        env:
          RYE_VERSION: '0.44.0'
          RYE_INSTALL_OPTION: '--yes'

      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Run tests
        run: ./scripts/test
